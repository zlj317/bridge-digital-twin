quarkus.http.port=8081
quarkus.http.host=0.0.0.0
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.banner.enabled=false
quarkus.log.category."com.bridge.twin".level=INFO

# 默认内存仓储（无中间件也能启动）；cluster 时通过 JdbcRepository 读 PostgreSQL
bdt.storage=${BDT_STORAGE:memory}
bdt.pg.url=${BDT_PG_URL:jdbc:postgresql://localhost:5432/bridge}
bdt.pg.user=${BDT_PG_USER:bridge}
bdt.pg.password=${BDT_PG_PASSWORD:bridge123}
bdt.redis.host=${BDT_REDIS_HOST:localhost}
bdt.redis.port=${BDT_REDIS_PORT:6379}
bdt.tdengine.url=${BDT_TAOS_URL:http://localhost:6041}
bdt.minio.endpoint=${BDT_MINIO_ENDPOINT:http://localhost:9000}
bdt.mqtt.host=${BDT_MQTT_HOST:localhost}
bdt.mqtt.port=${BDT_MQTT_PORT:1883}
