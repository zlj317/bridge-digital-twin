quarkus.http.port=8082
quarkus.http.host=0.0.0.0
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.banner.enabled=false
quarkus.log.category."com.bridge.twin".level=INFO

# MQTT 清洗链路（broker 不可达时自动降级为本地快照定时器，服务仍可用）
bdt.mqtt.enabled=${BDT_MQTT_ENABLED:true}
bdt.mqtt.host=${BDT_MQTT_HOST:localhost}
bdt.mqtt.port=${BDT_MQTT_PORT:1883}
bdt.mqtt.ws.port=${BDT_MQTT_WS_PORT:8083}
bdt.alarm.debounce.up=${BDT_ALARM_DEBOUNCE_UP:3}
bdt.alarm.debounce.down=${BDT_ALARM_DEBOUNCE_DOWN:3}
bdt.snapshot.interval.ms=${BDT_SNAPSHOT_INTERVAL_MS:2000}
bdt.pg.url=${BDT_PG_URL:jdbc:postgresql://localhost:5432/bridge}
bdt.pg.user=${BDT_PG_USER:bridge}
bdt.pg.password=${BDT_PG_PASSWORD:bridge123}
bdt.redis.host=${BDT_REDIS_HOST:localhost}
bdt.tdengine.url=${BDT_TAOS_URL:http://localhost:6041}
bdt.minio.endpoint=${BDT_MINIO_ENDPOINT:http://localhost:9000}
