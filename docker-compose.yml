name: bridge-digital-twin

# 文档第 6.5 节部署拓扑。单机 4C/8G 建议。
# 启动：cp .env.example .env && docker compose up -d
services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: bdt-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bridge}
      POSTGRES_USER: ${POSTGRES_USER:-bridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bridge123}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bridge} -d ${POSTGRES_DB:-bridge}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy: { resources: { limits: { memory: 1G } } }

  redis:
    image: redis:7.2-alpine
    container_name: bdt-redis
    command: redis-server --appendonly yes --maxmemory 220mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy: { resources: { limits: { memory: 256M } } }

  tdengine:
    image: tdengine/tdengine:3.3
    container_name: bdt-tdengine
    environment:
      TAOS_FQDN: tdengine
    ports:
      - "${TDENGINE_PORT:-6030}:6030"
      - "${TDENGINE_HTTP_PORT:-6041}:6041"
    volumes:
      - taos-data:/var/lib/taos
      - taos-log:/var/log/taos
      - ./deploy/tdengine/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "taos -s 'show databases;' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 10
    deploy: { resources: { limits: { memory: 1G } } }

  minio:
    image: minio/minio:2025
    container_name: bdt-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy: { resources: { limits: { memory: 512M } } }

  emqx:
    image: emqx/emqx:5.7
    container_name: bdt-emqx
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: 127.0.0.1
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-admin123}
      EMQX_ALLOW_ANONYMOUS: "true"
      EMQX_LISTENERS__TCP__DEFAULT__BIND: "0.0.0.0:1883"
      EMQX_LISTENERS__WS__DEFAULT__BIND: "0.0.0.0:8083"
    ports:
      - "${EMQX_MQTT_PORT:-1883}:1883"
      - "${EMQX_WS_PORT:-8083}:8083"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - ./deploy/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "emqx ctl status >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 10
    deploy: { resources: { limits: { memory: 512M } } }

  svc-bridge:
    build:
      context: ./backend
      dockerfile: Dockerfile.bridge
    container_name: bdt-svc-bridge
    environment:
      QUARKUS_HTTP_PORT: 8081
      BDT_PG_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bridge}
      BDT_PG_USER: ${POSTGRES_USER:-bridge}
      BDT_PG_PASSWORD: ${POSTGRES_PASSWORD:-bridge123}
      BDT_REDIS_HOST: redis
      BDT_MQTT_HOST: emqx
      BDT_MINIO_ENDPOINT: http://minio:9000
    ports:
      - "${SVC_BRIDGE_PORT:-8081}:8081"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 512M } } }

  svc-shm:
    build:
      context: ./backend
      dockerfile: Dockerfile.shm
    container_name: bdt-svc-shm
    environment:
      QUARKUS_HTTP_PORT: 8082
      BDT_PG_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bridge}
      BDT_PG_USER: ${POSTGRES_USER:-bridge}
      BDT_PG_PASSWORD: ${POSTGRES_PASSWORD:-bridge123}
      BDT_REDIS_HOST: redis
      BDT_MQTT_HOST: emqx
      BDT_TAOS_URL: http://tdengine:6041
    ports:
      - "${SVC_SHM_PORT:-8082}:8082"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      emqx: { condition: service_healthy }
      tdengine: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 512M } } }

  simulator:
    build:
      context: ./simulator
    container_name: bdt-simulator
    environment:
      MQTT_HOST: emqx
      MQTT_PORT: 1883
      BRIDGE_CODE: ${BRIDGE_CODE:-BR-DEMO-01}
      SIM_DENSITY: 62
    depends_on:
      emqx: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 512M } } }

  frontend-build:
    build:
      context: ./frontend
      args:
        VITE_DATA_MODE: ${VITE_DATA_MODE:-live}
        VITE_API_BASE: /api/v1
        VITE_MQTT_WS_URL: ws://localhost:${EMQX_WS_PORT:-8083}/mqtt
    volumes:
      - frontend-dist:/out
    command: ["sh", "-c", "cp -r /app/dist/. /out/ && sleep infinity"]

  nginx:
    image: nginx:1.24
    container_name: bdt-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
      - ./deploy/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - svc-bridge
      - svc-shm
    deploy: { resources: { limits: { memory: 128M } } }

  prometheus:
    image: prom/prometheus
    container_name: bdt-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    deploy: { resources: { limits: { memory: 256M } } }

  grafana:
    image: grafana/grafana
    container_name: bdt-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    deploy: { resources: { limits: { memory: 256M } } }

volumes:
  pg-data:
  redis-data:
  taos-data:
  taos-log:
  minio-data:
  frontend-dist:
  grafana-data:
