<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <defs>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2ED47A" stop-opacity=".2"/><stop offset="1" stop-color="#2ED47A" stop-opacity="0"/></linearGradient>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="2.5" orient="auto"><path d="M0,0 L0,5 L8,2.5 z" fill="#F2C14E"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="2.5" orient="auto"><path d="M0,0 L0,5 L8,2.5 z" fill="#00E5FF"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="2.5" orient="auto"><path d="M0,0 L0,5 L8,2.5 z" fill="#7B8CFF"/></marker>
  </defs>
  <style>
    text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}
    .t{font-size:26px;fill:#EAF6FF;font-weight:700}.sub{font-size:13px;fill:#7FA8D0}
    .act{fill:#0C2A3E;stroke:#00E5FF;stroke-width:1.6}
    .ah{font-size:14px;fill:#EAF6FF;font-weight:700}
    .life{stroke:#1E4E8C;stroke-width:1.4;stroke-dasharray:6 5}
    .m1{fill:none;stroke:#F2C14E;stroke-width:1.7;marker-end:url(#a1)}
    .m2{fill:none;stroke:#00E5FF;stroke-width:1.7;marker-end:url(#a2)}
    .m3{fill:none;stroke:#7B8CFF;stroke-width:1.7;marker-end:url(#a3)}
    .mt1{font-size:12px;fill:#F2C14E}.mt2{font-size:12px;fill:#00E5FF}.mt3{font-size:12px;fill:#7B8CFF}
    .p{font-size:11px;fill:#9FBEDC}.q{font-size:11px;fill:#F2C14E}
    .tick{font-size:11px;fill:#7FA8D0}
    .band{fill:#071329;stroke:#1E4E8C;stroke-width:1;opacity:.6}
  </style>
  <rect width="1280" height="900" fill="#050A18"/>
  <rect x="0" y="0" width="1280" height="64" fill="url(#hd)"/>
  <text class="t" x="36" y="40">08 · 仿真时序图</text>
  <text class="sub" x="990" y="40">车流 1s / SHM 2s 周期</text>

  <!-- 参与者 -->
  <g>
    <rect class="act" x="40" y="88" width="200" height="50" rx="8"/><text class="ah" x="140" y="118" text-anchor="middle">TrafficSimulator</text>
    <rect class="act" x="270" y="88" width="180" height="50" rx="8"/><text class="ah" x="360" y="118" text-anchor="middle">ShmSimulator</text>
    <rect class="act" x="480" y="88" width="160" height="50" rx="8"/><text class="ah" x="560" y="118" text-anchor="middle">EMQX Broker</text>
    <rect class="act" x="670" y="88" width="180" height="50" rx="8"/><text class="ah" x="760" y="118" text-anchor="middle">svc-shm</text>
    <rect class="act" x="880" y="88" width="180" height="50" rx="8"/><text class="ah" x="970" y="118" text-anchor="middle">Frontend</text>
  </g>
  <g class="life">
    <path d="M140 138 V846"/><path d="M360 138 V846"/><path d="M560 138 V846"/>
    <path d="M760 138 V846"/><path d="M970 138 V846"/>
  </g>
  <text class="tick" x="20" y="174">t = 1s</text>
  <text class="tick" x="20" y="350">t = 2s</text>
  <text class="tick" x="20" y="558">按需</text>
  <text class="tick" x="20" y="726">控制指令</text>

  <!-- 车流 1s -->
  <rect class="band" x="30" y="158" width="1220" height="164" rx="8"/>
  <text class="mt1" x="150" y="186">tick()：推进 1s，泊松到达 / 回收越界 / 对齐密度</text>
  <path class="m1" d="M140 202 H360"/><text class="mt1" x="176" y="196">（旁注：两仿真器同进程）</text>
  <path class="m1" d="M140 240 H560"/><text class="mt1" x="250" y="234">publish traffic/vehicle/BR-DEMO-01 · QoS 0 · stat + vehicles[] + removed[]</text>
  <path class="m1" d="M560 278 H970"/><text class="mt1" x="640" y="272">透传稀疏状态：vid / lane / t / speed / type</text>
  <path class="m1" d="M970 302 H1010 V324 H970"/><text class="mt1" x="990" y="318">CatmullRom 补帧 → InstancedMesh → 60FPS 渲染</text>

  <!-- SHM 2s -->
  <rect class="band" x="30" y="336" width="1220" height="206" rx="8"/>
  <text class="mt2" x="370" y="362">tick()：BridgeResponseModel.step(t) 计算 150 个测点值</text>
  <path class="m2" d="M360 382 H560"/><text class="mt2" x="378" y="376">publish sensor/raw/bridge/BR-DEMO-01 · QoS 1 · source=SIM</text>
  <path class="m2" d="M560 416 H760"/><text class="mt2" x="574" y="410">messageArrived → 清洗（pointCode / value / ts 偏差）</text>
  <path class="m2" d="M760 440 H800 V462 H760"/><text class="mt2" x="806" y="456">写实时值 / 时序；阈值判定 overStreak / normalStreak；聚合 metrics</text>
  <path class="m2" d="M760 490 H560"/><text class="mt2" x="574" y="484">publish realtime/bridge/...（2s 快照） QoS 1</text>
  <path class="m2" d="M560 522 H970"/><text class="mt2" x="620" y="516">快照 → HeatMapper / SensorLayer / 面板数值滚动</text>
  <text class="q" x="370" y="536">若连续 3 次超限：额外 publish alarm/bridge/event；连续 3 次正常：publish alarm/bridge/recover</text>

  <!-- 按需 REST -->
  <rect class="band" x="30" y="556" width="1220" height="152" rx="8"/>
  <text class="mt3" x="600" y="582">用户点击测点 / 构件 → 打开趋势卡</text>
  <path class="m3" d="M970 602 H760"/><text class="mt3" x="790" y="596">GET /api/v1/history/series?points=...&amp;interval=1m&amp;aggr=AVG</text>
  <path class="m3" d="M760 632 H800 V654 H760"/><text class="mt3" x="806" y="648">按时间桶降采样；不足 24h 用平滑序列回填</text>
  <path class="m3" d="M760 684 H970"/><text class="mt3" x="790" y="678">HistorySeries[] → sparkline 迷你图 + statistics 统计</text>

  <!-- 控制指令 -->
  <rect class="band" x="30" y="722" width="1220" height="112" rx="8"/>
  <path class="m1" d="M970 748 H560"/><text class="mt1" x="620" y="742">publish sim/bridge/command：SET_DENSITY / INJECT_OVERLIMIT</text>
  <path class="m1" d="M560 782 H140"/><text class="mt1" x="230" y="776">SET_DENSITY → TrafficSimulator.set_density() 下周期生效</text>
  <path class="m2" d="M560 812 H360"/><text class="mt2" x="382" y="806">INJECT_OVERLIMIT → BridgeResponseModel 连发 3 次 58.6 MPa</text>

  <text class="p" x="40" y="872">降级路径：EMQX 不可达 → 仿真器 --dry-run 打印报文；svc-shm 本地 tickLocalSimulation() 维持快照；前端断开 3 次自动切 mockSource。</text>
</svg>
