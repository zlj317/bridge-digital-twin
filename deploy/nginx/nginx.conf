upstream svc_bridge { server svc-bridge:8081; }
upstream svc_shm    { server svc-shm:8082; }
upstream emqx_ws    { server emqx:8083; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|svg|jpg|glb|ktx2|wasm)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 8.2 / 8.4：监测、告警、历史 → svc-shm
    location ~ ^/api/v1/bridges/[^/]+/(metrics|health|inspections)$ {
        proxy_pass http://svc_shm;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /api/v1/points    { proxy_pass http://svc_shm; include /etc/nginx/conf.d/proxy_params.inc; }
    location /api/v1/alarms    { proxy_pass http://svc_shm; include /etc/nginx/conf.d/proxy_params.inc; }
    location /api/v1/history   { proxy_pass http://svc_shm; include /etc/nginx/conf.d/proxy_params.inc; }
    location /api/v1/metrics   { proxy_pass http://svc_shm; include /etc/nginx/conf.d/proxy_params.inc; }
    location /q/health         { proxy_pass http://svc_shm; include /etc/nginx/conf.d/proxy_params.inc; }

    # 8.1 / 8.3：档案、构件、仿真 → svc-bridge
    location /api/v1/          { proxy_pass http://svc_bridge; include /etc/nginx/conf.d/proxy_params.inc; }
    location /q/               { proxy_pass http://svc_bridge; include /etc/nginx/conf.d/proxy_params.inc; }

    # MQTT over WebSocket
    location /mqtt {
        proxy_pass http://emqx_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
