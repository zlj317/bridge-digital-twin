global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: svc-bridge
    metrics_path: /q/metrics
    static_configs: [{ targets: ["svc-bridge:8081"] }]
  - job_name: svc-shm
    metrics_path: /q/metrics
    static_configs: [{ targets: ["svc-shm:8082"] }]
  - job_name: emqx
    metrics_path: /api/v5/prometheus/stats
    static_configs: [{ targets: ["emqx:18083"] }]
